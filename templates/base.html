<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Synapse">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/synapse-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/synapse-icon.svg">
    <script>
        // Применяем тему ДО загрузки стилей, чтобы не было мигания светлой темой.
        (function() {
            var stored = localStorage.getItem('theme');
            var dark = stored ? stored === 'dark'
                              : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <title>{% block title %}Synapse{% endblock %}</title>
    <style>
        body { background: #f5f6f8; }
        [data-bs-theme="dark"] body { background: #0f1115; }
        .navbar-brand { font-weight: 600; }
        .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600; flex: 0 0 auto;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        /* Меню-шестерёнка в правом верхнем углу: «Связи», «Устройства»,
           «Telegram», служебные пункты + переключатель темы
           живут здесь, а не торчат в navbar'е по одной кнопке. */
        .gear-wrap { position: relative; display: inline-block; }
        .gear-btn {
            width: 38px; height: 38px; padding: 0; border-radius: 10px;
            font-size: 18px; line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .gear-menu {
            position: absolute; top: calc(100% + 6px); right: 0;
            min-width: 220px; background: #fff;
            border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 12px 32px rgba(15,23,42,.18);
            padding: 6px; z-index: 1050;
            display: none;
        }
        .gear-menu.open { display: block; }
        .gear-menu a, .gear-menu button {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 8px 12px; border-radius: 8px;
            text-decoration: none; color: #1e293b;
            background: transparent; border: none;
            font-size: 14px; cursor: pointer; text-align: left;
        }
        .gear-menu a:hover, .gear-menu button:hover { background: #f1f5f9; }
        .gear-menu .gm-ico {
            font-size: 16px; width: 22px; text-align: center;
        }
        .gear-menu hr {
            margin: 6px 4px; border: 0; border-top: 1px solid #e2e8f0;
        }
        [data-bs-theme="dark"] .gear-menu {
            background: #1a1d24; border-color: #2a2f3a;
        }
        [data-bs-theme="dark"] .gear-menu a,
        [data-bs-theme="dark"] .gear-menu button { color: #e2e8f0; }
        [data-bs-theme="dark"] .gear-menu a:hover,
        [data-bs-theme="dark"] .gear-menu button:hover { background: #232831; }
        [data-bs-theme="dark"] .gear-menu hr { border-top-color: #2a2f3a; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom shadow-sm mb-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Synapse</a>
            <div class="ms-auto d-flex gap-2 align-items-center">
                {% if session.get('user_id') %}
                    <a class="btn btn-sm btn-primary" href="/contacts">Контакты</a>
                    <a class="btn btn-sm btn-outline-danger" href="/logout">Выход</a>
                    <div class="gear-wrap">
                        <button id="gear-btn"
                                class="btn btn-sm btn-outline-secondary gear-btn"
                                title="Настройки и навигация"
                                aria-label="Настройки"
                                aria-haspopup="true"
                                aria-expanded="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                        </button>
                        <div id="gear-menu" class="gear-menu" role="menu">
                            <a href="/profile">
                                <span class="gm-ico">👤</span>Профиль</a>
                            <a href="/contacts/manage">
                                <span class="gm-ico">🔗</span>Связи</a>
                            <a href="/devices">
                                <span class="gm-ico">📱</span>Устройства</a>
                            <a href="/download">
                                <span class="gm-ico">⤓</span>Клиент для Android</a>
                            <a href="/telegram">
                                <span class="gm-ico">✈</span>Telegram</a>
                            {% if session.get('can_manage_users') %}
                            <a href="/users">
                                <span class="gm-ico">👥</span>Пользователи</a>
                            {% endif %}
                            <hr>
                            <button type="button" id="theme-toggle">
                                <span class="gm-ico" id="theme-toggle-icon">🌙</span>
                                <span id="theme-toggle-label">Тёмная тема</span>
                            </button>
                        </div>
                    </div>
                {% else %}
                    <a class="btn btn-sm btn-outline-primary" href="/login">Вход</a>
                    <a class="btn btn-sm btn-primary" href="/register">Регистрация</a>
                    <button id="theme-toggle"
                            class="btn btn-sm btn-outline-secondary gear-btn"
                            title="Переключить тему" aria-label="Переключить тему">🌙</button>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block body %}{% endblock %}

    <script>
        // Меню-шестерёнка: открытие/закрытие, закрытие по клику снаружи и Esc.
        (function() {
            var gearBtn = document.getElementById('gear-btn');
            var gearMenu = document.getElementById('gear-menu');
            if (gearBtn && gearMenu) {
                gearBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var open = gearMenu.classList.toggle('open');
                    gearBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
                document.addEventListener('click', function(e) {
                    if (!gearMenu.classList.contains('open')) return;
                    if (gearMenu.contains(e.target) || e.target === gearBtn) return;
                    gearMenu.classList.remove('open');
                    gearBtn.setAttribute('aria-expanded', 'false');
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && gearMenu.classList.contains('open')) {
                        gearMenu.classList.remove('open');
                        gearBtn.setAttribute('aria-expanded', 'false');
                    }
                });
            }
            // Переключатель темы — работает и в шестерёнке, и в гостевом режиме.
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var ico = document.getElementById('theme-toggle-icon');
            var label = document.getElementById('theme-toggle-label');
            function sync() {
                var cur = document.documentElement.getAttribute('data-bs-theme');
                if (ico) {
                    ico.textContent = cur === 'dark' ? '☀' : '🌙';
                } else {
                    btn.textContent = cur === 'dark' ? '☀' : '🌙';
                }
                if (label) {
                    label.textContent = cur === 'dark'
                        ? 'Светлая тема' : 'Тёмная тема';
                }
            }
            sync();
            btn.addEventListener('click', function() {
                var cur = document.documentElement.getAttribute('data-bs-theme');
                var next = cur === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', next);
                localStorage.setItem('theme', next);
                sync();
            });
        })();
    </script>
    {% if session.get('user_id') %}
    <script>
        // Лёгкий heartbeat поддерживает точный статус «В сети» на всех
        // страницах, в том числе там, где нет собственного polling.
        (function() {
            let timer = null;
            function pingPresence() {
                if (document.hidden || navigator.onLine === false) return;
                fetch('/presence/ping', {
                    method: 'POST',
                    credentials: 'same-origin',
                    keepalive: true
                }).catch(function() {});
            }
            function schedulePresence() {
                if (timer) clearInterval(timer);
                pingPresence();
                timer = setInterval(pingPresence, 25000);
            }
            schedulePresence();
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) pingPresence();
            });
            window.addEventListener('online', pingPresence);
        })();
    </script>
    {% endif %}
</body>
</html>
